plugins { id 'com.android.application' }

android {
    namespace 'com.miscuentas.pro'
    compileSdk 35

    defaultConfig {
        applicationId 'com.miscuentas.pro'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '2.0.0'
