name: Mis Cuentas PRO - uso personal e informes
'on':
  workflow_dispatch: null
permissions:
  contents: write
concurrency:
  group: mis-cuentas-pro-actualizacion
  cancel-in-progress: false
jobs:
  corregir:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Aplicar uso personal e informes
      run: "python3 - <<'PYUPDATE'\nfrom pathlib import Path\nimport json,base64,hashlib\nfiles=json.loads('{\"app/src/main/assets/plans.js\": {\"old\": \"b6fad5a30b012297192908d67e7ea5b284952c8c63e420c8eef43975b7271415\", \"body\": \"\"}, \"app/src/main/assets/index.html\": {\"old\": \"d79367bcff4ed205b41b3789aefbe414641138624287f8435dd0e29767f8e550\", \"body\": \"\"\
        }, \"app/src/main/assets/app.js\": {\"old\": \"98930314d48458dbf2614ae63079be6bd668b62f95defbec613eb1f88a379c54\", \"body\": \"\"}, \"app/src/main/assets/pro-business.js\": {\"old\": \"6d7ace0eaf06c0149c39ca34e7ee1fe9c68b2444faff9d71f9d0c514e1d13f32\", \"body\": \"\"}, \"app/src/main/assets/pro-reports.js\": {\"old\": \"a8e184340d542deaa473a69c68d20ef5712ee771f40ececd34c39e43b07fff5c\", \"body\": \"\"}, \"app/src/main/assets/employees.js\": {\"old\": \"b8784fd89e7b100d3213facb1d273861c3a4f04060d971d816fbb8f5cccf3d4d\", \"body\": \"\"}, \"app/src/main/assets/agenda-ui.js\": {\"old\": \"77253d7eab67efde4fe14749e2186b57bf2b1917dc5d51b51abd5c9324bbc568\", \"body\": \"\"\
        }, \"tests/mcp-personal-reports.cjs\": {\"old\": null, \"body\": \"\"}}')\nfor name,item in files.items():\n p=Path(name);old=p.read_bytes() if p.exists() else None;new=base64.b64decode(item['body'])\n if old!=new and (hashlib.sha256(old).hexdigest() if old is not None else None)!=item['old']:raise SystemExit('Se detiene para conservar cambios en '+name)\nfor name,item in files.items():\n p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(item['body']))\n\nPYUPDATE\nnode tools/prepare-web.cjs"
    - name: Permitir actualización sobre la versión instalada
      run: 'python3 - <<''PYVERSION''

        import re

        from pathlib import Path

        p=Path(''app/build.gradle'');s=p.read_text();m=re.search(r''versionCode\s+(\d+)'',s)

        if not m:raise SystemExit(''No se encuentra versionCode'')

        s=s[:m.start(1)]+str(int(m.group(1))+1)+s[m.end(1):];p.write_text(s)

        PYVERSION'
    - name: Comprobar caja y contabilidad
      run: 'npm install --no-save --package-lock=false jsdom@30.1.2

        node tests/mcp-personal-reports.cjs

        node tests/mcp-accounting.cjs

        node tests/mcp-refunds.cjs'
    - name: Recuperar firma fija
      env:
        DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
      run: 'set -euo pipefail

        test -n "$DEBUG_KEYSTORE"

        mkdir -p "$HOME/.android"

        printf ''%s'' "$DEBUG_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"

        keytool -exportcert -alias androiddebugkey -keystore "$HOME/.android/debug.keystore" -storepass android -file /tmp/mcp-cert.der

        echo ''ba6a6ab18f22b25865cbbf5d4aa312b707a474b09ff1361f2f6448ae7518bef9  /tmp/mcp-cert.der'' | sha256sum --check'
    - name: Instalar SDK
      run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'
    - name: Compilar APK
      run: gradle --no-configuration-cache --no-build-cache --rerun-tasks :app:clean :app:assembleDebug --stacktrace
    - name: Verificar firma
      run: 'set -euo pipefail

        "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee /tmp/mcp-signature.txt

        grep -F ''Signer #1 certificate SHA-256 digest: ba6a6ab18f22b25865cbbf5d4aa312b707a474b09ff1361f2f6448ae7518bef9'' /tmp/mcp-signature.txt'
    - name: Guardar cambio comprobado
      run: "git config user.name 'github-actions[bot]'\ngit config user.email '41898282+github-actions[bot]@users.noreply.github.com'\ngit add app/build.gradle app/src/main/assets/plans.js app/src/main/assets/index.html app/src/main/assets/app.js app/src/main/assets/pro-business.js app/src/main/assets/pro-reports.js app/src/main/assets/employees.js app/src/main/assets/agenda-ui.js tests/mcp-personal-reports.cjs web/plans.js web/index.html web/app.js web/pro-business.js web/pro-reports.js web/employees.js web/agenda-ui.js\nif ! git diff --cached --quiet; then\n  git commit -m 'Quitar planes de prueba y ocultar formas de cobro sin importe'\n  git push\nfi"
    - uses: actions/upload-artifact@v4
      with:
        name: Mis-Cuentas-PRO-Personal-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
