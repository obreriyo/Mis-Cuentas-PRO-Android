name: Mis Cuentas PRO - efectivo por defecto
'on':
  workflow_dispatch: null
permissions:
  contents: write
concurrency:
  group: mis-cuentas-pro-actualizacion
  cancel-in-progress: false
jobs:
  corregir:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Seleccionar efectivo en nuevos cobros
      shell: bash
      run: "python3 - <<'PYUPDATE'\nfrom pathlib import Path\nchanges={'index.html': [('document.getElementById(\"paymentMethod\").value=\"\"', 'document.getElementById(\"paymentMethod\").value=\"cash\"'), ('<option value=\"cash\">Efectivo</option>', '<option value=\"cash\" selected>Efectivo</option>')], 'app.js': [('document.getElementById(\"paymentMethod\").value=\"\"', 'document.getElementById(\"paymentMethod\").value=\"cash\"')], 'tpv-ui.js': [(\"$('tpvPaymentMethod').value=''\", \"$('tpvPaymentMethod').value='cash'\"), (\"$('tpvMethod').value=''\", \"$('tpvMethod').value='cash'\"), ('<option value=\"cash\">Efectivo</option>', '<option value=\"cash\" selected>Efectivo</option>'), (\"$('tpvDiscount').value=0;draw();detail\", \"$('tpvDiscount').value=0;$('tpvMethod').value='cash';draw();detail\"), (\"cart=[];appointmentId='';drawCart()\", \"cart=[];appointmentId='';$('tpvMethod').value='cash';drawCart()\")], 'pro-business.js': [(\"$('collectMethod').value=''\", \"$('collectMethod').value='cash'\"), ('<option value=\"cash\">Efectivo</option>', '<option value=\"cash\" selected>Efectivo</option>')], 'backups.js': [(\"tpvMethod:'',tpvPaymentMethod:''\", \"tpvMethod:'cash',tpvPaymentMethod:'cash'\")]}\nfor name,pairs in changes.items():\n p=Path('app/src/main/assets')/name\n s=p.read_text(encoding='utf-8')\n for old,new in pairs:\n  if old not in s and new not in s:raise SystemExit('No se reconoce el formulario: '+name)\n  s=s.replace(old,new)\n p.write_text(s,encoding='utf-8')\nPath('tests/mcp-cash-default.cjs').write_text(\"const a=require('node:assert/strict'),h=require('./helpers/app-dom.cjs')(),{run,el,w}=h;\\nrun('openAdd()');a.equal(el('paymentMethod').value,'cash');a.equal(el('tpvMethod').value,'cash');a.equal(el('tpvPaymentMethod').value,'cash');a.equal(el('collectMethod').value,'cash');\\nrun(`data.movements=[{id:123,date:'2026-01-02',type:'Ingreso',concept:'Tarjeta',total:121,vat:21,paymentMethod:'card'}];editMovement(123)`);a.equal(el('paymentMethod').value,'card');run('openAdd()');a.equal(el('paymentMethod').value,'cash');el('tpvMethod').value='transfer';w.CATPVUI.drawCart();a.equal(el('tpvMethod').value,'transfer');w.CATPVUI.clearCart();a.equal(el('tpvMethod').value,'cash');run(`data.receivables=[{id:'test',client:'Cliente',concept:'Venta',date:'2026-01-02',due:'2026-01-03',total:10,vat:0,status:'pending'}];CAProBusiness.openCollect('test')`);a.equal(el('collectMethod').value,'cash');console.log('OK Efectivo predeterminado, tarjeta al editar y transferencia elegida conservadas');w.close();process.exit(0);\\n\",encoding='utf-8')\n\nPYUPDATE\nnode tools/prepare-web.cjs"
    - name: Permitir actualización sobre la versión instalada
      run: 'python3 - <<''PYVERSION''

        import re

        from pathlib import Path

        p=Path(''app/build.gradle'');s=p.read_text();m=re.search(r''versionCode\s+(\d+)'',s)

        if not m:raise SystemExit(''No se encuentra versionCode'')

        s=s[:m.start(1)]+str(int(m.group(1))+1)+s[m.end(1):];p.write_text(s)

        PYVERSION'
      shell: bash
    - name: Comprobar efectivo y edición
      run: 'npm install --no-save --package-lock=false jsdom@30.1.2

        node tests/mcp-cash-default.cjs'
      shell: bash
    - name: Recuperar firma fija
      env:
        DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
      run: 'set -euo pipefail

        test -n "$DEBUG_KEYSTORE"

        mkdir -p "$HOME/.android"

        printf ''%s'' "$DEBUG_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"

        keytool -exportcert -alias androiddebugkey -keystore "$HOME/.android/debug.keystore" -storepass android -file /tmp/mcp-cert.der

        echo ''ba6a6ab18f22b25865cbbf5d4aa312b707a474b09ff1361f2f6448ae7518bef9  /tmp/mcp-cert.der'' | sha256sum --check'
      shell: bash
    - name: Instalar SDK
      run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      shell: bash
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'
    - name: Compilar APK
      run: gradle --no-configuration-cache --no-build-cache --rerun-tasks :app:clean :app:assembleDebug --stacktrace
      shell: bash
    - name: Verificar firma
      run: 'set -euo pipefail

        "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee /tmp/mcp-signature.txt

        grep -F ''Signer #1 certificate SHA-256 digest: ba6a6ab18f22b25865cbbf5d4aa312b707a474b09ff1361f2f6448ae7518bef9'' /tmp/mcp-signature.txt'
      shell: bash
    - name: Guardar cambio comprobado
      run: "git config user.name 'github-actions[bot]'\ngit config user.email '41898282+github-actions[bot]@users.noreply.github.com'\ngit add app/build.gradle app/src/main/assets/index.html web/index.html app/src/main/assets/app.js web/app.js app/src/main/assets/tpv-ui.js web/tpv-ui.js app/src/main/assets/pro-business.js web/pro-business.js app/src/main/assets/backups.js web/backups.js tests/mcp-cash-default.cjs\nif ! git diff --cached --quiet; then\n  git commit -m 'Seleccionar efectivo por defecto en nuevos cobros'\n  git push\nfi"
      shell: bash
    - uses: actions/upload-artifact@v4
      with:
        name: Mis-Cuentas-PRO-Efectivo-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
