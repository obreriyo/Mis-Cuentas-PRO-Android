name: Mis Cuentas PRO - recuperar diferencia roja en Caja
'on':
  workflow_dispatch: null
permissions:
  contents: write
concurrency:
  group: mis-cuentas-pro-actualizacion
  cancel-in-progress: false
jobs:
  corregir:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Recuperar diferencia roja por mes
      run: "python3 - <<'PYUPDATE'\nfrom pathlib import Path\np=Path('app/src/main/assets/mcp-accounting.js')\ns=p.read_text()\nold='root.renderCash=function(){realCash();cashSummary.insertAdjacentHTML'\nnew='root.renderCash=function(){realCash();cashSummary.querySelectorAll(\\':scope > .panel\\').forEach((panel,i)=>{const b=monthlyBenefit(currentYear(),i+1);panel.insertAdjacentHTML(\\'beforeend\\',`<p class=\"mcpCashDifference\">Ingresos reales: <b>${eur(b.incomeReal)}</b><br>Ingresos contables: <b>${eur(b.incomeAccounting)}</b><br>Ingresos reales - contable: <b class=\"red\">${eur(b.difference)}</b></p>`)});cashSummary.insertAdjacentHTML'\nif new not in s:\n    if s.count(old)!=1:raise SystemExit('La pantalla de caja ha cambiado: se detiene para conservar tus cambios.')\n    p.write_text(s.replace(old,new,1))\nPath('tests/mcp-cash-difference.cjs').write_text('const a=require(\\'node:assert/strict\\'),h=require(\\'./helpers/app-dom.cjs\\')(),{run,el,w}=h;\\nrun(`data=CAStore.empty();data.settings.owner=\\'Prueba\\';data.movements=[{id:1,date:\\'2026-01-04\\',type:\\'Ingreso\\',concept:\\'Venta\\',total:121,accounting:100,vat:21,paymentMethod:\\'cash\\'},{id:2,date:\\'2026-02-04\\',type:\\'Ingreso\\',concept:\\'Venta\\',total:80,accounting:100,vat:0,paymentMethod:\\'card\\'},{id:3,date:\\'2025-01-04\\',type:\\'Ingreso\\',concept:\\'Otro año\\',total:999,accounting:0,vat:0,paymentMethod:\\'cash\\'}];data.bank=[{id:4,date:\\'2026-01-06\\',amount:40}];save();year.value=\\'2026\\';renderCash()`);\\nconst rows=()=>Array.from(el(\\'cashSummary\\').querySelectorAll(\\'.mcpCashDifference\\'));\\na.equal(rows().length,12);a.match(rows()[0].textContent,/121,00/);a.match(rows()[0].textContent,/100,00/);a.equal(rows()[0].querySelector(\\'.red\\').textContent,\\'21,00 €\\');a.equal(rows()[1].querySelector(\\'.red\\').textContent,\\'-20,00 €\\');a.equal(rows()[2].querySelector(\\'.red\\').textContent,\\'0,00 €\\');a.equal(run(\\'MCPAccounting.cashYear(2026)[0].cash\\'),60);\\nrun(\\'renderCash()\\');a.equal(rows().length,12);run(\"year.value=\\'2025\\';renderCash()\");a.equal(rows()[0].querySelector(\\'.red\\').textContent,\\'999,00 €\\');a.equal(rows()[1].querySelector(\\'.red\\').textContent,\\'0,00 €\\');console.log(\\'OK Caja: 12 meses, diferencia positiva, negativa, cero, año y render repetido\\');w.close();\\n')\n\nPYUPDATE\nnode tools/prepare-web.cjs"
    - name: Permitir actualización sobre la versión instalada
      run: 'python3 - <<''PYVERSION''

        import re

        from pathlib import Path

        p=Path(''app/build.gradle'');s=p.read_text();m=re.search(r''versionCode\s+(\d+)'',s)

        if not m:raise SystemExit(''No se encuentra versionCode'')

        s=s[:m.start(1)]+str(int(m.group(1))+1)+s[m.end(1):];p.write_text(s)

        PYVERSION'
    - name: Comprobar caja y contabilidad
      run: 'npm install --no-save --package-lock=false jsdom@30.1.2

        node tests/mcp-cash-difference.cjs

        node tests/mcp-accounting.cjs

        node tests/mcp-refunds.cjs'
    - name: Recuperar firma fija
      env:
        DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
      run: 'set -euo pipefail

        test -n "$DEBUG_KEYSTORE"

        mkdir -p "$HOME/.android"

        printf ''%s'' "$DEBUG_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"

        keytool -exportcert -alias androiddebugkey -keystore "$HOME/.android/debug.keystore" -storepass android -file /tmp/mcp-cert.der

        echo ''ba6a6ab18f22b25865cbbf5d4aa312b707a474b09ff1361f2f6448ae7518bef9  /tmp/mcp-cert.der'' | sha256sum --check'
    - name: Instalar SDK
      run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'
    - name: Compilar APK
      run: gradle --no-configuration-cache --no-build-cache --rerun-tasks :app:clean :app:assembleDebug --stacktrace
    - name: Verificar firma
      run: 'set -euo pipefail

        "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee /tmp/mcp-signature.txt

        grep -F ''Signer #1 certificate SHA-256 digest: ba6a6ab18f22b25865cbbf5d4aa312b707a474b09ff1361f2f6448ae7518bef9'' /tmp/mcp-signature.txt'
    - name: Guardar cambio comprobado
      run: "git config user.name 'github-actions[bot]'\ngit config user.email '41898282+github-actions[bot]@users.noreply.github.com'\ngit add app/build.gradle app/src/main/assets/mcp-accounting.js web/mcp-accounting.js tests/mcp-cash-difference.cjs\nif ! git diff --cached --quiet; then\n  git commit -m 'Recuperar diferencia real contable roja en Caja por mes'\n  git push\nfi"
    - uses: actions/upload-artifact@v4
      with:
        name: Mis-Cuentas-PRO-Caja-Corregida-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
