name: Mis Cuentas PRO 2.1.0 - Agenda, TPV y contabilidad
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mis-cuentas-pro-actualizacion
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Recuperar y comprobar firma fija
        env:
          DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$DEBUG_KEYSTORE" || { echo "Añade el secreto ANDROID_DEBUG_KEYSTORE_BASE64 a este repositorio"; exit 1; }
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
          keytool -exportcert -alias androiddebugkey -keystore "$HOME/.android/debug.keystore" -storepass android -file /tmp/mcp-cert.der
          echo 'ba6a6ab18f22b25865cbbf5d4aa312b707a474b09ff1361f2f6448ae7518bef9  /tmp/mcp-cert.der' | sha256sum --check
      - name: Aplicar integración conservando contabilidad
        run: |
          python3 - <<'PYUPDATE'
          import base64,lzma,json,hashlib
          from pathlib import Path
          payload=json.loads(lzma.decompress(base64.b64decode('')))
          for name,item in payload.items():
           p=Path(name);current=p.read_bytes() if p.exists() else None;new=base64.b64decode(item['body'])
           if current!=new and (hashlib.sha256(current).hexdigest() if current is not None else None)!=item['old']:raise SystemExit('El archivo ha cambiado: '+name+'. Se detiene para conservar tus cambios.')
          for name,item in payload.items():
           p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(item['body']))
          print('Mis Cuentas PRO 2.1.0 preparada. Parte contable conservada. Archivos:',len(payload))
          PYUPDATE
          node tools/prepare-web.cjs
      - name: Instalar herramientas de comprobación
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2 jsdom@30.1.2
          npx playwright install --with-deps chromium
      - name: Comprobar datos, contabilidad, agenda, TPV y móvil/tablet
        run: |
          mkdir -p test-results delivery
          node tests/verify.cjs
          node tests/payments.cjs
          node tests/sync.cjs
          node tests/employees.cjs
          node tests/pro-business.cjs
          node tests/tpv.cjs
          node tests/tpv-partial.cjs
          node tests/improvements-core.cjs
          node tests/sync-codec.cjs
          node tests/agenda.cjs
          node tests/agenda-contacts.cjs
          node tests/agenda-delete.cjs
          node tests/agenda-customer.cjs
          node tests/agenda-calendar.cjs
          node tests/agenda-custom-service.cjs
          node tests/agenda-hours.cjs
          node tests/agenda-overlap.cjs
          TZ=Europe/Madrid node tests/regressions-1-7-1.cjs
          node tests/backups-1-7-2.cjs
          node tests/appointment-actions-1-7-2.cjs
          node tests/employees-browser.cjs
          node tests/pro-business-browser.cjs
          node tests/tpv-browser.cjs
          node tests/tablet-plans-browser.cjs
          node tests/agenda-browser.cjs
          node tests/agenda-contacts-browser.cjs
          node tests/agenda-manual-browser.cjs
          node tests/agenda-confirm-browser.cjs
          node tests/agenda-customer-browser.cjs
          node tests/agenda-calendar-browser.cjs
          node tests/agenda-week-browser.cjs
          node tests/agenda-navigation-browser.cjs
          node tests/agenda-custom-service-browser.cjs
          node tests/agenda-hours-browser.cjs
          node tests/agenda-overlap-browser.cjs
          node tests/agenda-refinements-browser.cjs
          node tests/catalogue-dom.cjs
          node tests/tpv-partial-dom.cjs
          node tests/improvements-dom.cjs
          node tests/improvements-browser.cjs
          node tests/regressions-browser-1-7-1.cjs
          node tests/agenda-simple-dom.cjs
          node tests/agenda-simple-browser.cjs
          node tests/agenda-paging-dom.cjs
          node tests/agenda-paging-browser.cjs
          node tests/agenda-fullscreen-browser.cjs
          node tests/agenda-scroll-dom.cjs
          node tests/agenda-scroll-browser.cjs
          node tests/regressions-1-7-3.cjs
          node tests/regressions-browser-1-7-3.cjs
          node tests/randomized-tpv-1-7-3.cjs
          node tests/regressions-1-7-4.cjs
          node tests/mcp-accounting.cjs
          node tests/mcp-accounting-browser.cjs
      - name: Guardar comprobaciones
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Comprobaciones-Mis-Cuentas-PRO-2.1.0
          path: test-results
          if-no-files-found: ignore
      - name: Instalar SDK Android
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK con firma fija
        run: gradle --no-configuration-cache --no-build-cache --rerun-tasks :app:clean :app:assembleDebug --stacktrace
      - name: Verificar firma del APK
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee /tmp/mcp-signature.txt
          grep -F 'Signer #1 certificate SHA-256 digest: ba6a6ab18f22b25865cbbf5d4aa312b707a474b09ff1361f2f6448ae7518bef9' /tmp/mcp-signature.txt
      - name: Guardar cambios comprobados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle app/src/main/AndroidManifest.xml app/src/main/assets/agenda-calendar.js app/src/main/assets/agenda-core.js app/src/main/assets/agenda-ui.js app/src/main/assets/agenda-week.js app/src/main/assets/app.js app/src/main/assets/backups.js app/src/main/assets/boot.js app/src/main/assets/cloud.js app/src/main/assets/employees.js app/src/main/assets/index.html app/src/main/assets/manifest.webmanifest app/src/main/assets/mcp-accounting.js app/src/main/assets/payments.js app/src/main/assets/plans.js app/src/main/assets/pro-business.js app/src/main/assets/pro-formats.js app/src/main/assets/pro-reports.js app/src/main/assets/store.js app/src/main/assets/sw.js app/src/main/assets/sync-codec.js app/src/main/assets/theme.css app/src/main/assets/tpv-core.js app/src/main/assets/tpv-ui.js app/src/main/java/com/miscuentas/pro/MainActivity.java tests/agenda-browser.cjs tests/agenda-calendar-browser.cjs tests/agenda-calendar.cjs tests/agenda-confirm-browser.cjs tests/agenda-contacts-browser.cjs tests/agenda-contacts.cjs tests/agenda-custom-service-browser.cjs tests/agenda-custom-service.cjs tests/agenda-customer-browser.cjs tests/agenda-customer.cjs tests/agenda-delete.cjs tests/agenda-fullscreen-browser.cjs tests/agenda-hours-browser.cjs tests/agenda-hours.cjs tests/agenda-manual-browser.cjs tests/agenda-navigation-browser.cjs tests/agenda-overlap-browser.cjs tests/agenda-overlap.cjs tests/agenda-paging-browser.cjs tests/agenda-paging-dom.cjs tests/agenda-refinements-browser.cjs tests/agenda-scroll-browser.cjs tests/agenda-scroll-dom.cjs tests/agenda-simple-browser.cjs tests/agenda-simple-dom.cjs tests/agenda-week-browser.cjs tests/agenda.cjs tests/appointment-actions-1-7-2.cjs tests/backups-1-7-2.cjs tests/ca-debug-browser.cjs tests/catalogue-dom.cjs tests/employees-browser.cjs tests/employees.cjs tests/fixtures/business-logo.json tests/helpers/app-dom.cjs tests/improvements-browser.cjs tests/improvements-core.cjs tests/improvements-dom.cjs tests/mcp-accounting-browser.cjs tests/mcp-accounting.cjs tests/payments.cjs tests/pro-business-browser.cjs tests/pro-business.cjs tests/randomized-tpv-1-7-3.cjs tests/regressions-1-7-1.cjs tests/regressions-1-7-3.cjs tests/regressions-1-7-4.cjs tests/regressions-browser-1-7-1.cjs tests/regressions-browser-1-7-3.cjs tests/sync-codec.cjs tests/sync.cjs tests/tablet-plans-browser.cjs tests/tpv-browser.cjs tests/tpv-client-search-browser.cjs tests/tpv-partial-dom.cjs tests/tpv-partial.cjs tests/tpv.cjs tests/verify.cjs web/agenda-calendar.js web/agenda-core.js web/agenda-ui.js web/agenda-week.js web/app.js web/backups.js web/boot.js web/cloud.js web/employees.js web/index.html web/manifest.webmanifest web/mcp-accounting.js web/payments.js web/plans.js web/pro-business.js web/pro-formats.js web/pro-reports.js web/store.js web/sw.js web/sync-codec.js web/theme.css web/tpv-core.js web/tpv-ui.js
          if ! git diff --cached --quiet; then
            git commit -m "Integrar agenda y TPV conservando contabilidad y firma fija 2.1.0"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Mis-Cuentas-PRO-2.1.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
