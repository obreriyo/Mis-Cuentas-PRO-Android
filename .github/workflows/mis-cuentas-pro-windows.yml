name: Mis Cuentas PRO Windows - instalador
permissions:
  contents: write
concurrency:
  group: mis-cuentas-pro-windows
  cancel-in-progress: false
jobs:
  comprobar-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Comprobar actualización personal publicada
      run: 'python - <<''PYREADY''

        from pathlib import Path

        s=Path(''app/src/main/assets/plans.js'').read_text()

        if ''aplicación personal'' not in s:raise SystemExit(''Ejecuta primero mis-cuentas-pro-personal.yml y espera a que termine correctamente.'')

        PYREADY'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Preparar versión de Windows
      shell: bash
      run: "python3 - <<'PY'\nimport base64,hashlib,json,lzma\nfrom pathlib import Path\nblob=base64.b64decode('')\nassert hashlib.sha256(blob).hexdigest()=='169b57221733b4f1f36e415460ecd0513c6afd2907e1cbfcc8a3a9cc1808120a', 'Paquete incompleto'\ncontent=json.loads(lzma.decompress(blob))\nfor name,value in content['files'].items():\n    p=Path(name)\n    assert p.parts[0]=='desktop' and '..' not in p.parts and not p.is_absolute()\n    p.parent.mkdir(parents=True,exist_ok=True)\n    p.write_bytes(base64.b64decode(value))\nPath('desktop/checks.json').write_text(json.dumps(content['commands']))\nprint('Preparados '+str(len(content['files']))+' archivos de Windows')\nPY\n"
    - name: Instalar herramientas de comprobación
      run: 'npm install --no-save jsdom@30.1.2 playwright@1.58.2

        npx playwright install --with-deps chromium

        '
    - name: Comprobar contabilidad, datos, agenda, TPV y devoluciones
      shell: bash
      run: 'node tools/prepare-web.cjs

        node tests/mcp-personal-reports.cjs

        node tests/mcp-accounting.cjs

        node tests/mcp-refunds.cjs'
  windows:
    needs: comprobar-app
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
    - uses: actions/checkout@v4
    - name: Comprobar actualización personal publicada
      run: 'python - <<''PYREADY''

        from pathlib import Path

        s=Path(''app/src/main/assets/plans.js'').read_text()

        if ''aplicación personal'' not in s:raise SystemExit(''Ejecuta primero mis-cuentas-pro-personal.yml y espera a que termine correctamente.'')

        PYREADY'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Preparar archivos de Windows
      shell: bash
      run: "python - <<'PY'\nimport base64,hashlib,json,lzma\nfrom pathlib import Path\nblob=base64.b64decode('')\nassert hashlib.sha256(blob).hexdigest()=='169b57221733b4f1f36e415460ecd0513c6afd2907e1cbfcc8a3a9cc1808120a', 'Paquete incompleto'\ncontent=json.loads(lzma.decompress(blob))\nfor name,value in content['files'].items():\n    p=Path(name)\n    assert p.parts[0]=='desktop' and '..' not in p.parts and not p.is_absolute()\n    p.parent.mkdir(parents=True,exist_ok=True)\n    p.write_bytes(base64.b64decode(value))\nPath('desktop/checks.json').write_text(json.dumps(content['commands']))\nprint('Preparados '+str(len(content['files']))+' archivos de Windows')\nPY\n"
    - name: Instalar herramientas de Windows
      working-directory: desktop
      run: npm ci
    - name: Incorporar interfaz y contabilidad actuales
      working-directory: desktop
      run: npm run prepare-assets
    - name: Comprobar archivos, enlaces y guardado
      working-directory: desktop
      run: npm test
    - name: Comprobar programa, WhatsApp y datos tras reiniciar
      working-directory: desktop
      run: npm run test:desktop
    - name: Compilar instalador de Windows
      working-directory: desktop
      run: npm run dist
    - name: Abrir y comprobar el ejecutable compilado
      working-directory: desktop
      run: node tests/packaged.cjs
    - name: Guardar versión comprobada en el repositorio
      shell: bash
      run: "rm -f desktop/checks.json\ngit config user.name 'github-actions[bot]'\ngit config user.email '41898282+github-actions[bot]@users.noreply.github.com'\ngit add desktop\nif ! git diff --cached --quiet; then\n  git commit -m 'Añadir Mis Cuentas PRO para Windows conservando contabilidad'\n  git push\nfi\n"
    - name: Descargar instalador de Windows
      uses: actions/upload-artifact@v4
      with:
        name: Mis-Cuentas-PRO-Windows-Instalador
        if-no-files-found: error
        path: 'desktop/dist/*-Instalar.exe

          desktop/LEEME.txt

          '
'on':
  workflow_dispatch: null
