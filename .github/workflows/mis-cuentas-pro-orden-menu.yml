name: Mis Cuentas PRO - ordenar botones de inicio
'on':
  workflow_dispatch: null
permissions:
  contents: write
concurrency:
  group: mis-cuentas-pro-actualizacion
  cancel-in-progress: false
jobs:
  corregir:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Ordenar botones de inicio
      shell: bash
      run: "python3 - <<'PYUPDATE'\nfrom pathlib import Path\np=Path('app/src/main/assets/plans.js')\ns=p.read_text(encoding='utf-8')\nold=\"if(menu)for(const label of ['Mi cuenta','Ajustes'])\"\nnew=\"if(menu)for(const label of ['Agenda','TPV','Movimientos','Caja / Banco','Informes','Cobros pendientes','Empleados','Mi cuenta','Ajustes'])\"\nif new not in s:\n    if s.count(old)!=1:raise SystemExit('La versión personal debe estar instalada antes de cambiar el menú.')\n    p.write_text(s.replace(old,new,1),encoding='utf-8')\nPath('tests/mcp-menu-order.cjs').write_text(\"const a=require('node:assert/strict'),h=require('./helpers/app-dom.cjs')(),{w}=h;\\nconst menu=w.document.querySelector('#home>.homeMenu');\\nconst labels=()=>[...menu.children].map(x=>x.textContent.trim().replace(/^[^A-Za-zÁÉÍÓÚÑ]+/u,''));\\nconst expected=['Agenda','TPV','Movimientos','Caja / Banco','Informes','Cobros pendientes','Empleados','Mi cuenta','Ajustes'];\\na.deepEqual(labels(),expected);const nodes=[...menu.children],handlers=nodes.map(n=>n.onclick);w.CAPlans.refresh();a.deepEqual(labels(),expected);a.equal(menu.children.length,9);nodes.forEach((n,i)=>{a.equal(menu.children[i],n);a.equal(n.onclick,handlers[i])});a.equal(w.CAPlans.isFree(),false);console.log('OK Orden de nueve botones, sin duplicados y acciones conservadas');w.close();process.exit(0);\\n\",encoding='utf-8')\n\nPYUPDATE\nnode tools/prepare-web.cjs"
    - name: Permitir actualización sobre la versión instalada
      run: 'python3 - <<''PYVERSION''

        import re

        from pathlib import Path

        p=Path(''app/build.gradle'');s=p.read_text();m=re.search(r''versionCode\s+(\d+)'',s)

        if not m:raise SystemExit(''No se encuentra versionCode'')

        s=s[:m.start(1)]+str(int(m.group(1))+1)+s[m.end(1):];p.write_text(s)

        PYVERSION'
      shell: bash
    - name: Comprobar orden y botones
      run: 'npm install --no-save --package-lock=false jsdom@30.1.2

        node tests/mcp-menu-order.cjs'
      shell: bash
    - name: Recuperar firma fija
      env:
        DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
      run: 'set -euo pipefail

        test -n "$DEBUG_KEYSTORE"

        mkdir -p "$HOME/.android"

        printf ''%s'' "$DEBUG_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"

        keytool -exportcert -alias androiddebugkey -keystore "$HOME/.android/debug.keystore" -storepass android -file /tmp/mcp-cert.der

        echo ''ba6a6ab18f22b25865cbbf5d4aa312b707a474b09ff1361f2f6448ae7518bef9  /tmp/mcp-cert.der'' | sha256sum --check'
      shell: bash
    - name: Instalar SDK
      run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      shell: bash
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'
    - name: Compilar APK
      run: gradle --no-configuration-cache --no-build-cache --rerun-tasks :app:clean :app:assembleDebug --stacktrace
      shell: bash
    - name: Verificar firma
      run: 'set -euo pipefail

        "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee /tmp/mcp-signature.txt

        grep -F ''Signer #1 certificate SHA-256 digest: ba6a6ab18f22b25865cbbf5d4aa312b707a474b09ff1361f2f6448ae7518bef9'' /tmp/mcp-signature.txt'
      shell: bash
    - name: Guardar cambio comprobado
      run: "git config user.name 'github-actions[bot]'\ngit config user.email '41898282+github-actions[bot]@users.noreply.github.com'\ngit add app/build.gradle app/src/main/assets/plans.js web/plans.js tests/mcp-menu-order.cjs\nif ! git diff --cached --quiet; then\n  git commit -m 'Ordenar inicio: agenda, TPV, movimientos, caja, informes y cuenta'\n  git push\nfi"
      shell: bash
    - uses: actions/upload-artifact@v4
      with:
        name: Mis-Cuentas-PRO-Menu-Ordenado-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
